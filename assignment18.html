
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Size Chart</title>
</head>
<body>

    <h1>Clothing Size Chart</h1>
    <p>Use this table to compare clothing sizes.</p>

    <table border="1">
        <thead>
            <tr>
                <th>Size</th>
                <th>Chest (inches)</th>
                <th>Waist (inches)</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Small</td>
                <td>34-36</td>
                <td>28-30</td>
            </tr>

            <tr>
                <td>Medium</td>
                <td>38-40</td>
                <td>32-34</td>
            </tr>

            <tr>
                <td>Large</td>
                <td>42-44</td>
                <td>36-38</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
