
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A student webpage demonstrating different CSS selectors.">
    <meta name="author" content="Aastha Prajapati">

    <title>Assignment 22 - CSS Selectors</title>

    <style>
        /* 1. Element selector */
        body {
            font-family: Arial, sans-serif;
            background-color: #f3f4f6;
            color: #333333;
            margin: 20px;
        }

        /* 2. Class selector */
        .highlight {
            background-color: #dbeafe;
            padding: 12px;
            border-radius: 6px;
        }

        /* 3. ID selector */
        #main-heading {
            color: #1d4ed8;
            text-align: center;
        }

        /* 4. Descendant selector */
        nav a {
            color: #2563eb;
            text-decoration: none;
            margin: 8px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        /* Additional element selector */
        h2 {
            color: #166534;
        }

        /* Additional class selector */
        .card {
            background-color: white;
            padding: 15px;
            margin: 15px 0;
            border: 1px solid #dddddd;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <header>
        <h1 id="main-heading">Welcome to My Website</h1>

        <nav aria-label="Main Navigation">
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#skills">Skills</a>
        </nav>
    </header>

    <main>
        <section id="home" class="card">
            <h2>Home</h2>
            <p class="highlight">
                This page demonstrates four different CSS selector types.
            </p>
        </section>

        <section id="about" class="card">
            <h2>About Me</h2>
            <p>
                I am a BCA Artificial Intelligence student learning
                programming and web development.
            </p>
        </section>

        <section id="skills" class="card">
            <h2>My Skills</h2>
            <ul>
                <li>HTML</li>
                <li>CSS</li>
                <li>Java</li>
                <li>Problem Solving</li>
            </ul>
        </section>
    </main>

    <footer>
        <p>HTML &amp; CSS Practical Assignment 22</p>
    </footer>

</body>
</html>
