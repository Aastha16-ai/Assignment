
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Landing page hero section using CSS position and z-index.">
    <title>Assignment 29 - Hero Section</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f8fafc;
            color: #1e293b;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background-color: white;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #2563eb;
        }

        nav a {
            text-decoration: none;
            color: #334155;
            margin-left: 18px;
        }

        .hero {
            position: relative;
            overflow: hidden;
            min-height: 480px;
            padding: 90px 8%;
            display: flex;
            align-items: center;
            background-color: #eff6ff;
        }

        .circle {
            position: absolute;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            background-color: #bfdbfe;
            right: 8%;
            top: 70px;
            z-index: 1;
        }

        .small-circle {
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-color: #93c5fd;
            right: 23%;
            bottom: 35px;
            z-index: 1;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 520px;
        }

        .hero-content h1 {
            font-size: 46px;
            line-height: 1.2;
            margin-bottom: 20px;
            color: #1e3a8a;
        }

        .hero-content p {
            font-size: 17px;
            line-height: 1.7;
            color: #475569;
        }

        .hero-content a {
            display: inline-block;
            margin-top: 15px;
            padding: 13px 24px;
            background-color: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .hero-content a:hover {
            background-color: #1d4ed8;
        }

        @media (max-width: 600px) {
            nav {
                padding: 18px 5%;
            }

            nav a {
                margin-left: 8px;
                font-size: 14px;
            }

            .hero {
                padding: 60px 6%;
                min-height: 450px;
            }

            .hero-content h1 {
                font-size: 34px;
            }

            .circle {
                width: 180px;
                height: 180px;
                right: -35px;
                top: 30px;
            }

            .small-circle {
                width: 80px;
                height: 80px;
                right: 20%;
                bottom: 15px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <div class="logo">BrightSpace</div>
        <div>
            <a href="#home">Home</a>
            <a href="#about">About</a>
        </div>
    </nav>

    <main>
        <section class="hero" id="home">

            <div class="circle"></div>
            <div class="small-circle"></div>

            <div class="hero-content">
                <h1>Build Your Ideas Into Reality</h1>
                <p>
                    Discover new possibilities, learn useful skills,
                    and turn your creative ideas into meaningful projects.
                </p>
                <a href="#about">Explore More</a>
            </div>

        </section>

        <section id="about" style="padding: 35px 8%; text-align: center;">
            <h2>About BrightSpace</h2>
            <p>A simple landing page created with HTML and CSS.</p>
        </section>
    </main>

</body>
</html>
