
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login form centred using Flexbox.">
    <title>Centred Login Form</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .login {
            width: 100%;
            max-width: 380px;
            padding: 30px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 10px 30px #0002;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        h1 { text-align: center; margin: 0; }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #bbb;
            border-radius: 7px;
            font: inherit;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }

        a { color: #764ba2; }

        button {
            padding: 12px;
            border: none;
            border-radius: 7px;
            background: #764ba2;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover { background: #5d3a85; }
    </style>
</head>
<body>
    <form class="login" action="#" method="get">
        <h1>Welcome Back</h1>
        <p style="text-align:center; color:#666;">Please log in to continue.</p>

        <label class="field">
            Email
            <input type="email" name="email" placeholder="you@example.com" required>
        </label>

        <label class="field">
            Password
            <input type="password" name="password" placeholder="Enter password"
                   minlength="8" required>
        </label>

        <div class="options">
            <label><input type="checkbox" name="remember"> Remember me</label>
            <a href="#forgot">Forgot password?</a>
        </div>

        <button type="submit">Log In</button>
    </form>
</body>
</html>
