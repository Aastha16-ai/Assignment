
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Responsive photo gallery using CSS Grid.">
    <title>36 - Grid Photo Gallery</title>
    <style>
        * { box-sizing: border-box; margin: 0; }
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            padding: 25px;
        }
        h1 { text-align: center; margin-bottom: 25px; }
        .gallery {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: 180px;
            gap: 10px;
            max-width: 1100px;
            margin: auto;
        }
        figure {
            position: relative;
            overflow: hidden;
            border-radius: 10px;
        }
        figure img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform .4s;
        }
        figure:hover img { transform: scale(1.08); }
        figcaption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 10px;
            background: #0009;
        }
        .wide { grid-column: span 2; }
        .tall { grid-row: span 2; }
        .big { grid-column: span 2; grid-row: span 2; }

        @media (max-width: 800px) {
            .gallery { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 480px) {
            .gallery { grid-template-columns: 1fr; }
            .wide, .big { grid-column: auto; }
            .tall { grid-row: auto; }
        }
    </style>
</head>
<body>
    <h1>My Gallery</h1>
    <main class="gallery">
        <figure class="big">
            <img src="https://picsum.photos/id/1015/800/800" alt="River valley">
            <figcaption>River Valley</figcaption>
        </figure>
        <figure>
            <img src="https://picsum.photos/id/1016/400/400" alt="Canyon">
            <figcaption>Canyon</figcaption>
        </figure>
        <figure class="tall">
            <img src="https://picsum.photos/id/1018/400/800" alt="Mountain peak">
            <figcaption>Mountain Peak</figcaption>
        </figure>
        <figure>
            <img src="https://picsum.photos/id/1019/400/400" alt="Lake jetty">
            <figcaption>Lake Jetty</figcaption>
        </figure>
        <figure class="wide">
            <img src="https://picsum.photos/id/1036/800/400" alt="Snowy forest">
            <figcaption>Winter Forest</figcaption>
        </figure>
        <figure>
            <img src="https://picsum.photos/id/1039/400/400" alt="Waterfall">
            <figcaption>Waterfall</figcaption>
        </figure>
        <figure>
            <img src="https://picsum.photos/id/1043/400/400" alt="Evening sky">
            <figcaption>Evening Sky</figcaption>
        </figure>
    </main>
</body>
</html>
