
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Responsive product grid using CSS Grid auto-fit.">
    <title>37 - Auto-Fit Product Grid</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 30px 16px;
            font-family: Arial, sans-serif;
            background: #f5f6fa;
        }
        h1, .note { text-align: center; }
        .note { color: #666; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 25px auto;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 2px 8px #0001;
            text-align: center;
        }
        .card img {
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            border-radius: 8px;
        }
        .card h2 { font-size: 18px; }
        .price { color: #0a8754; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Our Products</h1>
    <p class="note">Resize the browser window to see the grid adjust.</p>

    <main class="grid">
        <article class="card">
            <img src="https://picsum.photos/id/1060/400/300" alt="Coffee">
            <h2>Coffee Beans</h2>
            <p class="price">₹499</p>
        </article>
        <article class="card">
            <img src="https://picsum.photos/id/1080/400/300" alt="Fresh strawberries">
            <h2>Strawberries</h2>
            <p class="price">₹199</p>
        </article>
        <article class="card">
            <img src="https://picsum.photos/id/292/400/300" alt="Bread">
            <h2>Sourdough Bread</h2>
            <p class="price">₹149</p>
        </article>
        <article class="card">
            <img src="https://picsum.photos/id/312/400/300" alt="Honey jar">
            <h2>Honey Jar</h2>
            <p class="price">₹329</p>
        </article>
    </main>
</body>
</html>
