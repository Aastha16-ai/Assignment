```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Audit Fix</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      line-height: 1.6;
    }

    header {
      background: #0f172a;
      color: white;
      padding: 20px;
      text-align: center;
    }

    nav {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 15px;
      background: #334155;
      padding: 12px;
    }

    nav a {
      color: white;
      text-decoration: none;
    }

    .content {
      display: flex;
      gap: 20px;
      padding: 20px;
      max-width: 1100px;
      margin: auto;
    }

    article, aside {
      padding: 20px;
      border-radius: 8px;
      overflow-wrap: anywhere;
    }

    article {
      flex: 2;
      background: #dbeafe;
      min-width: 0;
    }

    aside {
      flex: 1;
      background: #dcfce7;
      min-width: 0;
    }

    img {
      max-width: 100%;
      height: auto;
    }

    @media (max-width: 600px) {
      .content {
        flex-direction: column;
        padding: 12px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Responsive Layout</h1>
  </header>

  <nav>
    <a href="#home">Home</a>
    <a href="#about">About</a>
    <a href="#services">Services</a>
    <a href="#contact">Contact</a>
  </nav>

  <main class="content" id="home">
    <article id="about">
      <h2>Main Content</h2>
      <p>This section adjusts according to screen size.</p>
      <p>Long content should wrap instead of causing horizontal scrolling.</p>
    </article>

    <aside id="services">
      <h2>Sidebar</h2>
      <p>This sidebar moves below the main content on small screens.</p>
    </aside>
  </main>
</body>
</html>
```
